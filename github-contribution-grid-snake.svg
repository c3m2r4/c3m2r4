<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="140" viewBox="0 0 720 140" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">Animated contribution snake</title>
  <desc id="description">A green snake moving across a contribution grid.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="10" height="10" rx="2" fill="#0e4429" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <path id="route" d="M 28 28 H 692 V 64 H 28 V 100 H 692" fill="none" />
  </defs>
  <rect width="720" height="140" rx="10" fill="#0d1117" />
  <rect x="19" y="19" width="682" height="90" rx="8" fill="url(#grid)" />
  <g filter="url(#glow)">
    <circle r="10" fill="#39d353">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 28 28 H 692 V 64 H 28 V 100 H 692" />
    </circle>
    <circle r="8" fill="#26a641">
      <animateMotion begin="-0.12s" dur="7s" repeatCount="indefinite" path="M 28 28 H 692 V 64 H 28 V 100 H 692" />
    </circle>
    <circle r="7" fill="#1f883d">
      <animateMotion begin="-0.24s" dur="7s" repeatCount="indefinite" path="M 28 28 H 692 V 64 H 28 V 100 H 692" />
    </circle>
    <circle r="6" fill="#0e4429">
      <animateMotion begin="-0.36s" dur="7s" repeatCount="indefinite" path="M 28 28 H 692 V 64 H 28 V 100 H 692" />
    </circle>
  </g>
  <circle r="2.5" fill="#ffffff">
    <animateMotion dur="7s" repeatCount="indefinite" path="M 28 28 H 692 V 64 H 28 V 100 H 692" />
  </circle>
  <text x="24" y="130" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">CONTRIBUTION ACTIVITY</text>
</svg>
